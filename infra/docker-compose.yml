version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeflux
      POSTGRES_PASSWORD: tradeflux
      POSTGRES_DB: tradeflux
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Zookeeper (required by Kafka) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"  # exposed to host for local dev tools
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Kafka topic initialiser (one-shot) ─────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # `command` must be a one-element list, not a bare folded scalar: with a
    # plain string, the leading/trailing double quotes below became literal
    # characters passed to `bash -c` (they don't get stripped by YAML folding),
    # producing a single unparseable "word" and a `--topic: command not found`
    # error. As a list, Compose passes exactly one clean arg to `-c`.
    command:
      - >
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic tradeflux.ticks --partitions 1 --replication-factor 1 &&
        echo 'Topic ready.'
    restart: "no"

  # ── Tick Producer (mock data) ──────────────────────────────────────────────
  producer:
    build:
      context: ../producer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: tradeflux.ticks
    env_file:
      - ../.env

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://tradeflux:tradeflux@postgres:5432/tradeflux
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: tradeflux.ticks
      ALLOW_CORS: "true"
      MARKET_DATA_PROVIDER: mock
    env_file:
      - ../.env
    healthcheck:
      # curl isn't installed in the python:3.11-slim base image (backend/Dockerfile
      # doesn't add it), so a curl-based healthcheck fails with "executable file
      # not found" every time and the container is permanently marked unhealthy —
      # which then hangs `frontend`'s `depends_on: condition: service_healthy`
      # forever. Use Python's stdlib instead; it's already there.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── React / Vite Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pg_data:
